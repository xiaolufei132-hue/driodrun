name: DroidRun Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install deps
      run: |
        python -m pip install --upgrade pip
        pip install flask selenium pytest
    - name: Run API tests
      run: python -m pytest tests/api/ -v --tb=short
    - name: Run ADB tests
      run: python -m pytest tests/adb/ -v --tb=short
